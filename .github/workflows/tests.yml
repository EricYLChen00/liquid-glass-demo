name: Unit Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: unit-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: self-hosted
    defaults:
      run:
        working-directory: LiquidGlassDemo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selected: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build and Test
        run: |
          xcodebuild test \
            -project LiquidGlassDemo.xcodeproj \
            -scheme LiquidGlassDemo \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:LiquidGlassDemoTests \
            -resultBundlePath TestResults.xcresult \
            | xcpretty --color

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: LiquidGlassDemo/TestResults.xcresult
