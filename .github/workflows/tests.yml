name: Unit Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: unit-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: macos-15
    defaults:
      run:
        working-directory: LiquidGlassDemo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode-26.0.0.app/Contents/Developer

      - name: Build and Test
        run: |
          xcodebuild test \
            -project LiquidGlassDemo.xcodeproj \
            -scheme LiquidGlassDemo \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:LiquidGlassDemoTests \
            -resultBundlePath TestResults.xcresult \
            | xcpretty --color

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: LiquidGlassDemo/TestResults.xcresult
