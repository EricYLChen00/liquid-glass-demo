name: Lint

on:
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging LiquidGlassDemo/
